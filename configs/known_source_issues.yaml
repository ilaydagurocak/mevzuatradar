# Bilinen kaynak tutarsızlıkları
#
# Doğrulamanın başarısız olduğu, ancak hatanın sistemde DEĞİL kaynak metinde olduğu
# elle incelenip bağımsız kanıtla teyit edilmiş durumlar. Bir kayıt burada listelense bile
# etiket YALNIZCA doğrulama gerçekten başarısız olduğunda uygulanır; kaynak düzeltilirse kayıt
# kendiliğinden "uyumlu" olur ve rapor bu girdinin artık gerekmediğini bildirir.
issues:
  - id: kredi-gecici2-mulga-islenmemis
    source: bddk_kredi_siniflandirma
    amendment_url: https://www.resmigazete.gov.tr/eskiler/2016/12/20161214-4.htm
    amending_article: "1"
    operation: BIRIM_KALDIR
    location: {madde_type: gecici, madde: "2"}
    description: >-
      14/12/2016 tarihli ve 29918 sayılı Resmî Gazete'de yayımlanan değişiklik yönetmeliğinin
      1. maddesi geçici 2. maddeyi yürürlükten kaldırıyor. mevzuat.gov.tr konsolide metninde
      (HTML) madde "(Mülga:...)" notu olmadan tam metniyle yer alıyor; aynı değişiklik
      yönetmeliğinin 23. maddeye etkisi ise metne işlenmiş.
    evidence:
      - kaynak: Değişiklik yönetmeliğinin kendisi (Resmî Gazete)
        url: https://www.resmigazete.gov.tr/eskiler/2016/12/20161214-4.htm
      - kaynak: Lexpera konsolide metni (geçici 2. maddeyi "Mülga madde" olarak işaretliyor)
        url: https://www.lexpera.com.tr/mevzuat/yonetmelikler/kredilerin-siniflandirilmasi-ve-bunlar-icin-ayrilacak-karsiliklara-iliskin-usul-ve-esaslar-hakkinda
    checked: 2026-09-20
    note: mevzuat.gov.tr PDF sürümü ayrıca kontrol edilmedi.
  - id: sermaye-madde5-2018-islenmemis
    source: bddk_sermaye_yeterliligi
    amendment_url: https://www.resmigazete.gov.tr/eskiler/2018/03/20180314-4.htm
    amending_article: "1"
    operation: BIRIM_DEGISTIR
    location: {madde: "5"}
    description: >-
      14/3/2018 tarihli ve 30360 sayılı Resmî Gazete'deki değişiklik yönetmeliğinin 1. maddesi,
      5. maddenin birinci ve ikinci fıkralarını 22/6/2016 tarihli ve 29750 sayılı Kredilerin
      Sınıflandırılması Yönetmeliğine atıf yapacak şekilde değiştiriyor. mevzuat.gov.tr konsolide
      metninde fıkralar hâlâ 2016'da yürürlükten kalkan 1/11/2006 tarihli ve 26333 sayılı
      yönetmeliğe atıf yapıyor, metinde 29750'ye hiç atıf yok ve fıkra notu yalnızca
      RG-27/9/2016-29840 değişikliğini gösteriyor.
    evidence:
      - kaynak: Değişiklik yönetmeliğinin kendisi (Resmî Gazete)
        url: https://www.resmigazete.gov.tr/eskiler/2018/03/20180314-4.htm
      - kaynak: Değişiklik metninin yeniden yayımı (Alomaliye)
        url: https://www.alomaliye.com/2018/03/14/bankalarin-sermaye-yeterliliginin-olculmesi/
    checked: 2026-09-21
    note: Aynı değişikliğin 34. maddeye etkisi ayrıca incelenmedi.

# Değişiklik notlarının biçimsel sorunları.
#
# Yukarıdaki issues: girdileri "kayıt doğru ama konsolide metin eksik" vakalarıdır ve
# doğrulama başarısız olduğunda etiket üretirler. Buradaki girdiler farklıdır: kayıt
# doğrulanabilir, sorun nottaki REFERANSIN hangi Resmî Gazete sayfasına karşılık
# geldiğinin tespit edilmesindedir. Etiket üretmezler; hangi kaynakta hangi konvansiyon
# sapmasının görüldüğünü belgelerler.
annotation_issues:
  - id: ft-ucret-not-yururluk-tarihi
    source: tcmb_ft_ucret_teblig
    kind: yururluk_tarihi_yazilmis
    note_ref: RG-1/12/2023-32386
    actual_ref: RG-25/11/2023-32380
    amendment_url: https://www.resmigazete.gov.tr/eskiler/2023/11/20231125-31.htm
    description: >-
      Konsolide metnin 12. maddesindeki "(Mülga üçüncü cümle:RG-1/12/2023-32386)" ve
      "(Mülga ikinci cümle:RG-1/12/2023-32386)" notları yayım tarihi değil YÜRÜRLÜK
      tarihini taşıyor. Tarih–sayı çifti kendi içinde tutarlı: 29/11/2023 sayısı 32384
      olduğundan 1/12/2023 gerçekten 32386'dır. Ancak o gün bu tebliği değiştiren hiçbir
      düzenleme yayımlanmamış; 1/12/2023 tarihli Resmî Gazete'nin tebliğler bölümünde
      yalnızca TL mevduat dönüşümü, altın hesapları ve YUVAM tebliğleri var. Değişiklik
      25/11/2023 tarihli ve 32380 sayılı Resmî Gazete'de "Finansal Tüketicilerden
      Alınacak Ücretlere İlişkin Usûl ve Esaslar Hakkında Tebliğ (Sayı: 2020/7)'de
      Değişiklik Yapılmasına Dair Tebliğ (Sayı: 2023/33)" adıyla yayımlanmış ve kendi
      2. maddesi gereği 1/12/2023'te yürürlüğe girmiştir.
    impact: >-
      Nottaki tarihin içindekiler sayfası açılır (200 döner) ama ilgili başlık bulunamaz,
      mükerrer sayı da 404 verir. Belirti "sayfa var, değişiklik yok" biçiminde görünür;
      ağ hatasından veya desen hatasından ayırt edilmesi gerekir.
    evidence:
      - kaynak: Değişiklik tebliğinin kendisi (Resmî Gazete, 25/11/2023)
        url: https://www.resmigazete.gov.tr/eskiler/2023/11/20231125-31.htm
      - kaynak: >-
          Tebliğ metninin yeniden yayımı (Alomaliye); 12. maddenin üçüncü fıkrasının
          üçüncü cümlesi ile altıncı fıkrasının ikinci cümlesinin kaldırıldığını ve
          yürürlüğün 1/12/2023 olduğunu gösteriyor
        url: https://www.alomaliye.com/2023/11/25/finansal-tuketicilerden-alinacak-ucretlere-iliskin-usul-ve-esaslar-sayi-2023-33/
      - kaynak: 29/11/2023 Resmî Gazete sayısının 32384 olduğu (sayı–tarih eşlemesi için)
        url: https://www.ntv.com.tr/turkiye/resmi-gazetede-bugun-29-kasim-2023-tarihli-ve-32384-sayili-resmi-gazete,F54OL7mKwUmZ4v5MZzd2yA
    workaround: >-
      find_amendment_urls(..., geri_gun=N) nottaki tarihten geriye doğru tarar ve bulduğu
      günün gerçek sayısını sayfanın başlığından düzeltir. Yürürlük tarihi yayımdan önce
      olamayacağı için arama tek yönlüdür. Bkz. tests/test_rg_geri_tarama.py
    checked: 2026-10-20
